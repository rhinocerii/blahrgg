<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 15px; fill: #1a1a1a; font-weight: 700; }
    .subtitle { font-size: 11px; fill: #666; }
    .group-label { font-size: 11px; fill: #333; }
    .emp-label { font-size: 10px; fill: #888; }
    .wage-label { font-size: 12px; font-weight: 700; }
    .threshold-label { font-size: 11px; font-weight: 700; fill: #b71c1c; }
    .note { font-size: 9px; fill: #999; }
    .axis-label { font-size: 10px; fill: #666; }
  </style>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="title">Median hourly wage vs. cost of basic needs</text>
  <text x="380" y="40" text-anchor="middle" class="subtitle">Six largest low-wage occupation groups, Lansing-East Lansing MSA, May 2024</text>

  <!-- Chart area: x=200 to x=720, bars from y=60 to y=370 -->
  <!-- Scale: $0 at x=200, $25 at x=700. Each $1 = 20px -->

  <!-- Gridlines -->
  <line x1="200" y1="55" x2="200" y2="375" stroke="#eee" stroke-width="1"/>
  <line x1="300" y1="55" x2="300" y2="375" stroke="#eee" stroke-width="1"/>
  <line x1="400" y1="55" x2="400" y2="375" stroke="#eee" stroke-width="1"/>
  <line x1="500" y1="55" x2="500" y2="375" stroke="#eee" stroke-width="1"/>
  <line x1="600" y1="55" x2="600" y2="375" stroke="#eee" stroke-width="1"/>
  <line x1="700" y1="55" x2="700" y2="375" stroke="#eee" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="200" y="390" text-anchor="middle" class="axis-label">$0</text>
  <text x="300" y="390" text-anchor="middle" class="axis-label">$5</text>
  <text x="400" y="390" text-anchor="middle" class="axis-label">$10</text>
  <text x="500" y="390" text-anchor="middle" class="axis-label">$15</text>
  <text x="600" y="390" text-anchor="middle" class="axis-label">$20</text>
  <text x="700" y="390" text-anchor="middle" class="axis-label">$25</text>

  <!-- Threshold line at $21.74: x = 200 + (21.74 * 20) = 634.8 -->
  <line x1="634.8" y1="50" x2="634.8" y2="378" stroke="#b71c1c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="634.8" y="408" text-anchor="middle" class="threshold-label">$21.74/hr needed</text>

  <!-- Bar height: 40px each, gap: 12px. 6 bars from y=62 -->
  <!-- Sorted lowest to highest wage -->

  <!-- 1. Food Prep: $16.73, 16,250 workers. width = 16.73 * 20 = 334.6 -->
  <rect x="200" y="62" width="334.6" height="40" rx="3" fill="#c62828"/>
  <text x="195" y="78" text-anchor="end" class="group-label">Food prep/serving</text>
  <text x="195" y="92" text-anchor="end" class="emp-label">16,250 workers</text>
  <text x="540" y="87" text-anchor="start" class="wage-label" fill="#333">$16.73</text>

  <!-- 2. Personal Care: $17.16, 3,200 workers. width = 17.16 * 20 = 343.2 -->
  <rect x="200" y="114" width="343.2" height="40" rx="3" fill="#d32f2f"/>
  <text x="195" y="130" text-anchor="end" class="group-label">Personal care</text>
  <text x="195" y="144" text-anchor="end" class="emp-label">3,200 workers</text>
  <text x="549" y="139" text-anchor="start" class="wage-label" fill="#333">$17.16</text>

  <!-- 3. Healthcare Support: $18.20, 7,140 workers. width = 18.20 * 20 = 364 -->
  <rect x="200" y="166" width="364" height="40" rx="3" fill="#e53935"/>
  <text x="195" y="182" text-anchor="end" class="group-label">Healthcare support</text>
  <text x="195" y="196" text-anchor="end" class="emp-label">7,140 workers</text>
  <text x="570" y="191" text-anchor="start" class="wage-label" fill="#333">$18.20</text>

  <!-- 4. Building/Grounds: $18.23, 5,750 workers. width = 18.23 * 20 = 364.6 -->
  <rect x="200" y="218" width="364.6" height="40" rx="3" fill="#ef5350"/>
  <text x="195" y="234" text-anchor="end" class="group-label">Building/grounds</text>
  <text x="195" y="248" text-anchor="end" class="emp-label">5,750 workers</text>
  <text x="571" y="243" text-anchor="start" class="wage-label" fill="#333">$18.23</text>

  <!-- 5. Transport: $21.05, 16,960 workers. width = 21.05 * 20 = 421 -->
  <rect x="200" y="270" width="421" height="40" rx="3" fill="#ff8a80"/>
  <text x="195" y="286" text-anchor="end" class="group-label">Transport/material</text>
  <text x="195" y="300" text-anchor="end" class="emp-label">16,960 workers</text>
  <text x="627" y="295" text-anchor="start" class="wage-label" fill="#333">$21.05</text>

  <!-- 6. Sales: $22.58, 15,250 workers. width = 22.58 * 20 = 451.6 -->
  <rect x="200" y="322" width="451.6" height="40" rx="3" fill="#a5d6a7"/>
  <text x="195" y="338" text-anchor="end" class="group-label">Sales/related</text>
  <text x="195" y="352" text-anchor="end" class="emp-label">15,250 workers</text>
  <text x="658" y="347" text-anchor="start" class="wage-label" fill="#333">$22.58</text>

  <!-- Source -->
  <text x="380" y="418" text-anchor="middle" class="note">BLS Occupational Employment and Wage Statistics, Lansing-East Lansing MSA, May 2024. Threshold from Part 1 residual-income method.</text>
</svg>
