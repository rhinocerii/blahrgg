<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .header { font-size: 15px; fill: #1a1a1a; font-weight: 700; }
    .subheader { font-size: 11px; fill: #666; }
    .pct { font-size: 36px; font-weight: 800; }
    .role { font-size: 14px; font-weight: 700; }
    .detail { font-size: 11px; fill: #666; }
    .note { font-size: 9px; fill: #999; }
  </style>

  <text x="300" y="28" text-anchor="middle" class="header">Who Has a Lawyer in Eviction Court</text>
  <text x="300" y="44" text-anchor="middle" class="subheader">Legal representation rates in Michigan eviction proceedings</text>

  <!-- Tenant side -->
  <rect x="40" y="75" width="240" height="170" rx="8" fill="#ffebee"/>
  <text x="160" y="120" text-anchor="middle" class="role" fill="#b71c1c">Tenants</text>
  <text x="160" y="170" text-anchor="middle" class="pct" fill="#b71c1c">4.8%</text>
  <text x="160" y="195" text-anchor="middle" class="detail">have legal representation</text>
  <text x="160" y="225" text-anchor="middle" class="detail" style="fill:#b71c1c;font-weight:600">95.2% face eviction alone</text>

  <!-- Landlord side -->
  <rect x="320" y="75" width="240" height="170" rx="8" fill="#e8f5e9"/>
  <text x="440" y="120" text-anchor="middle" class="role" fill="#2d6a2e">Landlords</text>
  <text x="440" y="170" text-anchor="middle" class="pct" fill="#2d6a2e">83.2%</text>
  <text x="440" y="195" text-anchor="middle" class="detail">have legal representation</text>
  <text x="440" y="225" text-anchor="middle" class="detail" style="fill:#2d6a2e;font-weight:600">17x more likely to have a lawyer</text>

  <text x="300" y="280" text-anchor="middle" class="detail">Michigan has no right to counsel in eviction cases.</text>
  <text x="300" y="296" text-anchor="middle" class="detail">Approximately 1 in 6 renter households faces an eviction filing each year.</text>

  <text x="300" y="316" text-anchor="middle" class="note">Source: University of Michigan Poverty Solutions, Michigan Evictions data (2014-2018 representation rates).</text>
</svg>
