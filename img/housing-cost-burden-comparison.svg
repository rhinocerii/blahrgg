<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" style="max-width:100%; height:auto; font-family:Georgia, serif;">
  <rect width="720" height="370" fill="#ffffff"/>
  <text x="130" y="22" font-size="15" font-weight="bold" fill="#1a1a1a">Can Lansing households cover housing and basic needs?</text>
  <text x="130" y="40" font-size="11" fill="#555">Income needed to cover housing and basic needs vs actual income (2024 ACS 1-year, weighted by household-size mix)</text>
  <rect x="130" y="54" width="10" height="10" fill="#1f7a1f"/>
  <text x="144" y="63" font-size="10" fill="#333">Covers basics (positive residual)</text>
  <rect x="358" y="54" width="10" height="10" fill="#b71c1c"/>
  <text x="372" y="63" font-size="10" fill="#333">Deficit (cannot cover basic needs)</text>
  <text x="118" y="90" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">Homeowners</text>
  <text x="118" y="106" font-size="10" text-anchor="end" fill="#777">26,574 households</text>
  <rect x="130" y="70" width="339.04718898171143" height="50" fill="#1f7a1f"/>
  <rect x="469.04718898171143" y="70" width="220.95281101828854" height="50" fill="#b71c1c"/>
  <text x="299.5235944908557" y="99" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">61%</text>
  <text x="579.5235944908557" y="99" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">39%</text>
  <text x="299.5235944908557" y="134" font-size="10" text-anchor="middle" fill="#555">16,089</text>
  <text x="579.5235944908557" y="134" font-size="10" text-anchor="middle" fill="#555">10,485</text>
  <text x="118" y="170" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">Renters</text>
  <text x="118" y="186" font-size="10" text-anchor="end" fill="#777">23,635 households</text>
  <rect x="130" y="150" width="166.66130738311827" height="50" fill="#1f7a1f"/>
  <rect x="296.66130738311824" y="150" width="393.3386926168818" height="50" fill="#b71c1c"/>
  <text x="213.33065369155912" y="179" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">30%</text>
  <text x="493.3306536915592" y="179" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">70%</text>
  <text x="213.33065369155912" y="214" font-size="10" text-anchor="middle" fill="#555">7,034</text>
  <text x="493.3306536915592" y="214" font-size="10" text-anchor="middle" fill="#555">16,601</text>
  <text x="130" y="326" font-size="11" fill="#333" font-weight="bold">40% of owner households and 70% of renter households earn below the income</text>
  <text x="130" y="340" font-size="11" fill="#333" font-weight="bold">needed to cover housing and basic needs.</text>
  <text x="130" y="346" font-size="9" fill="#999">Sources: Census ACS 2024 1-year (B25009, B25118, B25031), USDA Food Plans, AHRQ MEPS, HUD LAI, BLS CEX, IRS 2024 tax brackets.</text>
  <text x="130" y="360" font-size="9" fill="#999">Thresholds: owner $62,515 (weighted by household-size mix); renter $57,973. Comparable to ALICE framework.</text>
</svg>
