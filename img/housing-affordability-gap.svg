<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .label { font-size: 12px; fill: #333; }
    .value { font-size: 26px; font-weight: 800; }
    .sublabel { font-size: 11px; }
    .threshold { stroke-width: 2; stroke-dasharray: 6,4; }
    .threshold-label { font-size: 12px; font-weight: 700; }
    .header { font-size: 16px; fill: #1a1a1a; font-weight: 700; }
    .subheader { font-size: 11px; fill: #666; }
    .note { font-size: 9px; fill: #999; }
    .gap-label { font-size: 11px; font-weight: 700; }
  </style>

  <text x="400" y="28" text-anchor="middle" class="header">The affordability gap</text>
  <text x="400" y="46" text-anchor="middle" class="subheader">Monthly take-home pay vs. $2,995/mo cost of housing + basic needs for a single adult in Lansing</text>

  <!-- Residual threshold line at $2,995 (1-person after-tax basics)
       Scale: y-bottom = 430, each $1 = 0.115 pixels (scaled for new range)
       $2,995 at y = 430 - (2995 * 0.115) = 430 - 344.4 = 86 -->
  <line x1="60" y1="86" x2="740" y2="86" class="threshold" stroke="#b71c1c"/>
  <text x="65" y="79" class="threshold-label" fill="#b71c1c">$2,995/mo needed for housing + basic needs</text>

  <!-- Bar: Minimum wage take-home ($1,789)
       height = 1789 * 0.115 = 205.7; y = 430 - 206 = 224 -->
  <rect x="110" y="224" width="150" height="206" rx="5" fill="#b71c1c"/>
  <text x="185" y="290" text-anchor="middle" class="value" fill="#fff">$1,789</text>
  <text x="185" y="312" text-anchor="middle" class="sublabel" style="fill:#ffcdd2">Take-home / month</text>
  <text x="185" y="455" text-anchor="middle" class="label">Michigan minimum wage</text>
  <text x="185" y="470" text-anchor="middle" class="label">($12.48/hr, full-time)</text>
  <text x="185" y="206" text-anchor="middle" class="gap-label" fill="#b71c1c">&#8722;$1,206/mo short</text>
  <line x1="185" y1="213" x2="185" y2="222" stroke="#b71c1c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bar: Median Lansing renter take-home ($2,425)
       height = 2425 * 0.115 = 278.9; y = 430 - 279 = 151 -->
  <rect x="325" y="151" width="150" height="279" rx="5" fill="#e65100"/>
  <text x="400" y="220" text-anchor="middle" class="value" fill="#fff">$2,425</text>
  <text x="400" y="242" text-anchor="middle" class="sublabel" style="fill:#ffe0b2">Take-home / month</text>
  <text x="400" y="455" text-anchor="middle" class="label">Lansing renter at</text>
  <text x="400" y="470" text-anchor="middle" class="label">the median income</text>
  <text x="400" y="133" text-anchor="middle" class="gap-label" fill="#e65100">&#8722;$570/mo short</text>
  <line x1="400" y1="140" x2="400" y2="149" stroke="#e65100" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bar: Metro area median take-home ($3,334)
       height = 3334 * 0.115 = 383.4; y = 430 - 383 = 47 -->
  <rect x="540" y="47" width="150" height="383" rx="5" fill="#2d6a2e"/>
  <text x="615" y="120" text-anchor="middle" class="value" fill="#fff">$3,334</text>
  <text x="615" y="142" text-anchor="middle" class="sublabel" style="fill:#c8e6c9">Take-home / month</text>
  <text x="615" y="455" text-anchor="middle" class="label">Lansing metro area</text>
  <text x="615" y="470" text-anchor="middle" class="label">median wage ($24.34/hr)</text>
  <text x="615" y="32" text-anchor="middle" class="gap-label" fill="#2d6a2e">+$339/mo covers basics</text>

  <text x="400" y="492" text-anchor="middle" class="note">Monthly take-home after federal income tax (IRS 2024) + MI state (4.25%) + Lansing city (1%) + FICA (7.65%).</text>
  <text x="400" y="504" text-anchor="middle" class="note">Sources: Census ACS B25119 2024 1-yr; BLS OES May 2024; USDA + MEPS + HUD LAI (1-adult basic needs).</text>
</svg>
