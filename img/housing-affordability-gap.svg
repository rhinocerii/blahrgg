<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .label { font-size: 12px; fill: #333; }
    .value { font-size: 26px; font-weight: 800; }
    .sublabel { font-size: 11px; }
    .threshold { stroke-width: 2; stroke-dasharray: 6,4; }
    .threshold-label { font-size: 11px; font-weight: 700; }
    .header { font-size: 16px; fill: #1a1a1a; font-weight: 700; }
    .subheader { font-size: 11px; fill: #666; }
    .note { font-size: 9px; fill: #999; }
    .gap-label { font-size: 11px; font-weight: 700; }
    .annot { font-size: 10px; font-weight: 600; }
  </style>

  <text x="400" y="28" text-anchor="middle" class="header">The Affordability Gap</text>
  <text x="400" y="46" text-anchor="middle" class="subheader">Monthly income vs. monthly cost of basics in Lansing</text>

  <!-- Real costs threshold (top) -->
  <line x1="50" y1="95" x2="700" y2="95" class="threshold" stroke="#b71c1c"/>
  <text x="55" y="85" class="threshold-label" fill="#b71c1c">$4,125/mo to cover basics</text>
  <text x="55" y="108" style="font-size:9px; fill:#b71c1c;">(rent + car + food + doctor + utilities)</text>

  <!-- Federal 30% threshold (below, more space) -->
  <line x1="50" y1="145" x2="700" y2="145" class="threshold" stroke="#999"/>
  <text x="55" y="160" class="threshold-label" fill="#999">$4,227/mo federal 30% standard (counts housing only)</text>

  <!-- Bar: Minimum wage -->
  <rect x="90" y="295" width="160" height="115" rx="5" fill="#b71c1c"/>
  <text x="170" y="335" text-anchor="middle" class="value" fill="#fff">$2,163</text>
  <text x="170" y="358" text-anchor="middle" class="sublabel" style="fill:#ffcdd2">Minimum wage</text>
  <text x="170" y="430" text-anchor="middle" class="label">Michigan minimum</text>
  <text x="170" y="444" text-anchor="middle" class="label">wage ($12.48/hr)</text>
  <text x="170" y="272" text-anchor="middle" class="gap-label" fill="#b71c1c">-$1,962/mo short</text>
  <line x1="170" y1="279" x2="170" y2="293" stroke="#b71c1c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bar: Median renter -->
  <rect x="310" y="223" width="160" height="187" rx="5" fill="#e65100"/>
  <text x="390" y="268" text-anchor="middle" class="value" fill="#fff">$3,048</text>
  <text x="390" y="291" text-anchor="middle" class="sublabel" style="fill:#ffe0b2">Typical renter</text>
  <text x="390" y="430" text-anchor="middle" class="label">Lansing renter at</text>
  <text x="390" y="444" text-anchor="middle" class="label">the middle income</text>
  <text x="390" y="200" text-anchor="middle" class="gap-label" fill="#e65100">-$1,077/mo short</text>
  <line x1="390" y1="207" x2="390" y2="221" stroke="#e65100" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Bar: MSA median (all workers) -->
  <rect x="530" y="150" width="160" height="260" rx="5" fill="#616161"/>
  <text x="610" y="200" text-anchor="middle" class="value" fill="#fff">$4,224</text>
  <text x="610" y="223" text-anchor="middle" class="sublabel" style="fill:#e0e0e0">Metro area</text>
  <text x="610" y="243" text-anchor="middle" class="sublabel" style="fill:#e0e0e0">middle wage</text>
  <text x="610" y="430" text-anchor="middle" class="label">Lansing metro</text>
  <text x="610" y="444" text-anchor="middle" class="label">all workers</text>

  <!-- Annotations for the MSA bar: inside the gap between lines -->
  <text x="610" y="124" text-anchor="middle" class="annot" fill="#b71c1c">Still short of real costs</text>
  <text x="610" y="170" text-anchor="middle" class="annot" fill="#2d6a2e">Passes federal standard</text>

  <text x="400" y="472" text-anchor="middle" class="note">Monthly figures. Sources: Census ACS B25119/B25064 (City of Lansing); HUD FMR FY2026; BLS OES May 2024 (MSA); HUD LAI; Salary.com.</text>
</svg>
