<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" style="max-width:100%; height:auto; font-family:Georgia, serif;">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="130" y="22" font-size="15" font-weight="bold" fill="#1a1a1a">Lansing household composition by tenure</text>
  <text x="130" y="40" font-size="11" fill="#555">Renters skew toward single adults and single-parent families; owners skew toward childless couples</text>
  <rect x="130" y="56" width="10" height="10" fill="#4a6fa5"/>
  <text x="144" y="65" font-size="10" fill="#333">1 adult, no children (income needed: $45,214)</text>
  <rect x="130" y="70" width="10" height="10" fill="#6b8cae"/>
  <text x="144" y="79" font-size="10" fill="#333">2 adults, no children (income needed: $63,026)</text>
  <rect x="420" y="56" width="10" height="10" fill="#e88015"/>
  <text x="434" y="65" font-size="10" fill="#333">2 parents + children (income needed: $74K-$83K)</text>
  <rect x="420" y="70" width="10" height="10" fill="#b71c1c"/>
  <text x="434" y="79" font-size="10" fill="#333">Single parent + children (income needed: $76K-$96K)</text>
  <text x="118" y="90" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">Renters</text>
  <text x="118" y="106" font-size="10" text-anchor="end" fill="#777">23,635 households</text>
  <rect x="130" y="70" width="421.35815527818914" height="50" fill="#4a6fa5"/>
  <text x="340.67907763909454" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">70%</text>
  <text x="340.67907763909454" y="134" font-size="10" text-anchor="middle" fill="#555">16,598</text>
  <rect x="551.3581552781891" y="70" width="61.43431351808758" height="50" fill="#6b8cae"/>
  <text x="582.0753120372328" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">10%</text>
  <text x="582.0753120372328" y="134" font-size="10" text-anchor="middle" fill="#555">2,420</text>
  <rect x="612.7924687962767" y="70" width="39.653056907129255" height="50" fill="#e88015"/>
  <text x="632.6189972498413" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">7%</text>
  <rect x="652.4455257034059" y="70" width="77.55447429659402" height="50" fill="#b71c1c"/>
  <text x="691.2227628517029" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">13%</text>
  <text x="691.2227628517029" y="134" font-size="10" text-anchor="middle" fill="#555">3,055</text>
  <text x="118" y="170" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">Owners</text>
  <text x="118" y="186" font-size="10" text-anchor="end" fill="#777">26,574 households</text>
  <rect x="130" y="150" width="308.57981485662674" height="50" fill="#4a6fa5"/>
  <text x="284.28990742831337" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">51%</text>
  <text x="284.28990742831337" y="214" font-size="10" text-anchor="middle" fill="#555">13,667</text>
  <rect x="438.57981485662674" y="150" width="182.75005644615038" height="50" fill="#6b8cae"/>
  <text x="529.954843079702" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">30%</text>
  <text x="529.954843079702" y="214" font-size="10" text-anchor="middle" fill="#555">8,094</text>
  <rect x="621.3298713027771" y="150" width="73.58320162564912" height="50" fill="#e88015"/>
  <text x="658.1214721156016" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">12%</text>
  <text x="658.1214721156016" y="214" font-size="10" text-anchor="middle" fill="#555">3,259</text>
  <rect x="694.9130729284262" y="150" width="35.08692707157372" height="50" fill="#b71c1c"/>
  <text x="712.4565364642131" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">6%</text>
  <text x="130" y="328" font-size="11" fill="#333" font-weight="bold">Single parents with children: 13% of renter households, 6% of owner households.</text>
  <text x="130" y="346" font-size="9" fill="#999">Source: Census ACS B25115, 2024 1-year estimates, City of Lansing. Income-needed thresholds are residual-income basic-needs requirements (housing + food + medical + transport + childcare + internet + other necessities, after federal and state/local taxes).</text>
</svg>
